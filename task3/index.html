<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo-list</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <h1>Todo-list</h1>
        
        <!-- Поле ввода и кнопка добавления -->
        <div class="input-group">
            <input type="text" id="task-input" placeholder="Введите новую задачу...">
            <button id="add-btn">Добавить</button>
        </div>

        <!-- Счётчик -->
        <div class="stats" id="stats">
            Осталось: 0, Выполнено: 0
        </div>

        <!-- Фильтры -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="active">Активные</button>
            <button class="filter-btn" data-filter="completed">Завершённые</button>
        </div>

        <!-- Список задач (генерируется в JS) -->
        <ul id="task-list"></ul>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
