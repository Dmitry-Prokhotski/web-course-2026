<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNAKE — Mushroom Kingdom Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Фоновые облака (декоративные) -->
    <div class="clouds">
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>
    </div>

    <div class="game-container">
        <h1 class="game-title">
            <span class="letter">S</span>
            <span class="letter">N</span>
            <span class="letter">A</span>
            <span class="letter">K</span>
            <span class="letter">E</span>
        </h1>
        <p class="subtitle">★ MUSHROOM KINGDOM ★</p>

        <div class="info-panel">
            <div class="coin-box">
                <span class="coin-icon">🪙</span>
                <span id="score" class="coin-score">× 000</span>
            </div>
            <button id="restart-btn">RESET</button>
        </div>

        <div class="canvas-wrapper">
            <canvas id="game-canvas" width="400" height="400"></canvas>

            <div id="game-over-overlay" class="overlay hidden">
                <div class="overlay-content">
                    <h2>GAME OVER</h2>
                    <p>COINS: <span id="final-score">000</span></p>
                    <p class="blink">PRESS RESET</p>
                    <button id="restart-overlay-btn">TRY AGAIN</button>
                </div>
            </div>
        </div>

        <p class="hint">◄ ► ▲ ▼ USE ARROW KEYS</p>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
