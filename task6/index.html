<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Змейка на Canvas</title>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="game-container">
        <h1 class="game-title">ЗМЕЙКА</h1>

        <div class="info-panel">
            <div class="score-box">
                <span class="label">СЧЁТ</span>
                <span id="score" class="value">0</span>
            </div>
            <button id="restart-btn">ЗАНОВО</button>
        </div>

        <div class="canvas-wrapper">
            <canvas id="game-canvas" width="400" height="400"></canvas>

            <!-- Оверлей поверх канваса, показывается когда игра окончена -->
            <div id="game-over-overlay" class="overlay hidden">
                <div class="overlay-content">
                    <h2>ИГРА ОКОНЧЕНА</h2>
                    <p>Итоговый счёт: <span id="final-score">0</span></p>
                    <button id="restart-overlay-btn">НАЧАТЬ ЗАНОВО</button>
                </div>
            </div>
        </div>

        <p class="hint">Управление: стрелки ← ↑ → ↓</p>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
