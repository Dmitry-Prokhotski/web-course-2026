<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симон говорит | Неоновая версия</title>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="grid-bg"></div>
    
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>
    <div class="glow-orb orb-4"></div>

    <div class="game-container">
        <h1 class="game-title">СИМОН</h1>
        <p class="subtitle">ГОВОРИТ</p>
        
        <div class="info-panel">
            <div class="score-box">
                <span class="label">УРОВЕНЬ</span>
                <span id="level" class="value">0</span>
            </div>
            <button id="start-btn">СТАРТ</button>
        </div>

        <div class="board-wrapper">
            <div class="board" id="board">
                <div class="btn green" data-id="0"></div>
                <div class="btn red" data-id="1"></div>
                <div class="btn yellow" data-id="2"></div>
                <div class="btn blue" data-id="3"></div>
                <div class="center-circle">
                    <div class="center-inner"></div>
                </div>
            </div>
        </div>

        <div id="message" class="message">НАЖМИ «СТАРТ»</div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
