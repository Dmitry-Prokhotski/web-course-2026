<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says | Neon Edition</title>
    <!-- Подключаем современный шрифт -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Фоновые декоративные элементы -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>

    <div class="game-container">
        <h1 class="game-title">СИМОН<br><span>ГОВОРИТ</span></h1>
        
        <div class="info-panel">
            <div class="score-box">
                <span class="label">УРОВЕНЬ</span>
                <span id="level" class="value">0</span>
            </div>
            <button id="start-btn">СТАРТ</button>
        </div>

        <div class="board-wrapper">
            <div class="board" id="board">
                <div class="btn green" data-id="0"></div>
                <div class="btn red" data-id="1"></div>
                <div class="btn yellow" data-id="2"></div>
                <div class="btn blue" data-id="3"></div>
                <!-- Центральный круг для красоты -->
                <div class="center-circle"></div>
            </div>
        </div>

        <div id="message" class="message">Нажмите «Старт», чтобы начать</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
